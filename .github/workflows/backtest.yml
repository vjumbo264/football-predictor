name: Backtest Lab
on:
  workflow_dispatch:
    inputs:
      stage:
        required: true
        type: choice
        options: [smoke, validate, official, publish]
        default: smoke
      freeze_commit:
        description: 'Commit containing results/frozen_config.json (official stage only)'
        type: string
      data_authorized:
        description: 'Confirmed permission for this public pipeline and requested outputs'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: phase1-${{ inputs.stage }}
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MPLBACKEND: Agg
jobs:
  validation:
    if: github.ref == 'refs/heads/main' && (inputs.stage == 'smoke' || inputs.stage == 'validate')
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Synthetic acceptance tests
        run: python -m pytest -q
      - name: Check authorization
        if: inputs.stage == 'validate'
        env:
          AUTHORIZED: ${{ inputs.data_authorized }}
        run: test "$AUTHORIZED" = true
      - uses: actions/cache@v4
        if: inputs.stage == 'validate'
        with:
          path: results/local/validation/cache
          key: validation-${{ github.sha }}
      - name: Validation only — no holdout read
        if: inputs.stage == 'validate'
        run: python -m footpred.pipeline validate --out results/local/validation
      - uses: actions/upload-artifact@v4
        if: inputs.stage == 'validate'
        with:
          name: validation-freeze-for-review
          path: |
            results/local/validation/*.json
            results/local/validation/*.csv
            results/local/validation/*.md
  official:
    if: github.ref == 'refs/heads/main' && inputs.stage == 'official' && inputs.data_authorized
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify the committed freeze and acquire one-time holdout lock
        env:
          FREEZE_COMMIT: ${{ inputs.freeze_commit }}
        run: |
          [[ "$FREEZE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          python -m footpred.pipeline verify-freeze --freeze-commit "$FREEZE_COMMIT"
          for season in 2021 2122 2223 2324 2425 2526; do
            for league in E0 SP1 I1 D1 F1; do
              test -s "data/raw/$season/$league.csv"
            done
          done
          if git ls-remote --exit-code --tags origin refs/tags/phase1-official-test-claimed; then
            echo 'The one-time official run has already been claimed. Do not rerun the holdout.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a phase1-official-test-claimed -m "Official holdout claimed by Actions run $GITHUB_RUN_ID; freeze $FREEZE_COMMIT"
          git push origin refs/tags/phase1-official-test-claimed
      - name: Run the single official holdout
        env:
          FREEZE_COMMIT: ${{ inputs.freeze_commit }}
        run: python -m footpred.pipeline holdout --freeze-commit "$FREEZE_COMMIT" --out results/local/official
      - name: Commit aggregate results, leaving odds ledgers out of the publication
        run: |
          cp results/local/official/*.json results/
          rm -f results/predictions_*.meta.json
          cp results/local/official/*.md results/
          cp -r results/local/official/plots results/
          if [ -d results/local/official/forward/plots ]; then
            cp -r results/local/official/forward/plots results/forward-plots
          fi
          git add results
          git commit -m "Record the single official Phase 1 holdout (run $GITHUB_RUN_ID)"
          git push origin HEAD:main
      - name: Publish immutable official release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="phase1-$GITHUB_RUN_NUMBER"
          tar -czf "$RUNNER_TEMP/reliability-and-betting-plots.tar.gz" -C results plots
          gh release create "$tag" results/REPORT.md results/test_metrics.json results/betting_test.json results/baselines.json results/frozen_config.json results/provenance.json results/data_quality.md "$RUNNER_TEMP/reliability-and-betting-plots.tar.gz" --target "$(git rev-parse HEAD)" --title "Phase 1 official holdout $GITHUB_RUN_NUMBER" --notes-file results/REPORT.md
  republish:
    if: github.ref == 'refs/heads/main' && inputs.stage == 'publish' && inputs.data_authorized
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish existing official results without rescoring
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s results/test_metrics.json && test -s results/provenance.json
          tar -czf "$RUNNER_TEMP/reliability-and-betting-plots.tar.gz" -C results plots
          gh release create "phase1-$GITHUB_RUN_NUMBER" results/REPORT.md results/test_metrics.json results/betting_test.json results/baselines.json results/frozen_config.json results/provenance.json results/data_quality.md "$RUNNER_TEMP/reliability-and-betting-plots.tar.gz" --target "$GITHUB_SHA" --title "Phase 1 results publication $GITHUB_RUN_NUMBER" --notes-file results/REPORT.md
