name: Backtest Lab
on:
  workflow_dispatch:
    inputs:
      stage:
        required: true
        type: choice
        options: [smoke, ingest, validate, official, publish]
        default: smoke
      freeze_commit:
        description: 'Commit containing results/frozen_config.json (official only)'
        type: string
      data_authorized:
        description: 'Confirmed private individual use; publish aggregate outputs only'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: phase1-${{ inputs.stage }}
  cancel-in-progress: false
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MPLBACKEND: Agg
jobs:
  validation:
    if: github.ref == 'refs/heads/main' && (inputs.stage == 'smoke' || inputs.stage == 'ingest' || inputs.stage == 'validate')
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Synthetic acceptance tests
        run: python -m pytest -q
      - name: Check authorization
        if: inputs.stage != 'smoke'
        env:
          AUTHORIZED: ${{ inputs.data_authorized }}
        run: test "$AUTHORIZED" = true
      - uses: ./.github/actions/football-data
        if: inputs.stage != 'smoke'
        with:
          scope: train
          cache-key: ${{ secrets.FOOTBALL_DATA_CACHE_KEY }}
      - name: Check source completeness without scoring
        if: inputs.stage == 'ingest'
        run: python -m footpred.pipeline audit-training
      - name: Validation only — no holdout inputs fetched or read
        if: inputs.stage == 'validate'
        run: python -u -m footpred.pipeline validate --out results/local/validation
      - uses: actions/upload-artifact@v4
        if: inputs.stage == 'validate'
        with:
          name: validation-freeze-for-review
          if-no-files-found: error
          path: |
            results/local/validation/frozen_config.json
            results/local/validation/search_log.csv
            results/local/validation/betting_search_log.csv
            results/local/validation/validation_metrics.json
            results/local/validation/data_quality_validation.md
  official:
    if: github.ref == 'refs/heads/main' && inputs.stage == 'official' && inputs.data_authorized
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Require a previously committed freeze before fetching test inputs
        env:
          FREEZE_COMMIT: ${{ inputs.freeze_commit }}
        run: |
          [[ "$FREEZE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          python -m footpred.pipeline verify-freeze --freeze-commit "$FREEZE_COMMIT"
      - uses: ./.github/actions/football-data
        with:
          scope: train
          cache-key: ${{ secrets.FOOTBALL_DATA_CACHE_KEY }}
      - uses: ./.github/actions/football-data
        with:
          scope: test
          cache-key: ${{ secrets.FOOTBALL_DATA_CACHE_KEY }}
      - name: Fetch optional separate forward slice (not cached)
        run: |
          if ! python scripts/fetch_snapshots.py forward; then
            echo '::warning::Forward slice unavailable; the completed-season evaluation is unaffected.'
            rm -rf data/raw/2627
          fi
      - name: Check data integrity before acquiring one-time holdout lock
        env:
          FREEZE_COMMIT: ${{ inputs.freeze_commit }}
        run: |
          python -m footpred.pipeline preflight --freeze-commit "$FREEZE_COMMIT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a phase1-official-test-claimed -m "Official holdout claimed by Actions run $GITHUB_RUN_ID; freeze $FREEZE_COMMIT"
          git push origin refs/tags/phase1-official-test-claimed
      - name: Run the single official holdout
        env:
          FREEZE_COMMIT: ${{ inputs.freeze_commit }}
        run: python -u -m footpred.pipeline holdout --freeze-commit "$FREEZE_COMMIT" --out results/local/official
      - name: Commit allowlisted aggregate outputs only
        shell: bash
        run: |
          src=results/local/official
          for file in REPORT.md test_metrics.json betting_test.json baselines.json provenance.json data_quality.md; do
            cp "$src/$file" "results/$file"
            git add "results/$file"
          done
          cp -r "$src/plots" results/
          git add results/plots/*.png
          if [ -f "$src/forward_metrics.json" ]; then
            cp "$src/forward_metrics.json" results/
            cp -r "$src/forward/plots" results/forward-plots
            git add results/forward_metrics.json results/forward-plots/*.png
          fi
          git commit -m "Record the single official Phase 1 holdout (run $GITHUB_RUN_ID)"
          git push origin HEAD:main
  publish:
    if: github.ref == 'refs/heads/main' && inputs.stage == 'publish' && inputs.data_authorized
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Publish the committed aggregates without rescoring
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s results/test_metrics.json && test -s results/provenance.json
          assets=(results/REPORT.md results/test_metrics.json results/betting_test.json results/baselines.json results/frozen_config.json results/provenance.json results/data_quality.md results/data_quality_validation.md results/validation_metrics.json results/search_log.csv results/betting_search_log.csv)
          plot_dirs=(plots)
          if [ -f results/forward_metrics.json ]; then
            assets+=(results/forward_metrics.json)
            plot_dirs+=(forward-plots)
          fi
          tar -czf "$RUNNER_TEMP/reliability-and-betting-plots.tar.gz" -C results "${plot_dirs[@]}"
          gh release create "phase1-real-$GITHUB_RUN_NUMBER" "${assets[@]}" "$RUNNER_TEMP/reliability-and-betting-plots.tar.gz" --target "$GITHUB_SHA" --title "Phase 1 historical walk-forward backtest" --notes-file results/REPORT.md
