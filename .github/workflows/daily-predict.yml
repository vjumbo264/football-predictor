name: Daily Premier League Predictions

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      window_hours:
        description: 'Prediction kickoff window in hours (default 36)'
        required: false
        default: '36'

permissions:
  contents: read

jobs:
  predict-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore runtime data cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: pl-raw-csvs-${{ github.run_id }}
          restore-keys: |
            pl-raw-csvs-
      - name: Fit frozen models and ingest predictions
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          python -m jobs.predict_and_ingest --window-hours "${{ inputs.window_hours || '36' }}"
